[theme]
font = "Space Mono:https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap, sans-serif"
headingFont = "Space Mono:https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap, sans-serif"
baseFontWeight = 500
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#B86A00"
backgroundColor = "#ECE7DC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"

[theme.dark]
primaryColor = "#FFB000"
backgroundColor = "#111111"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#EDE6D6"
